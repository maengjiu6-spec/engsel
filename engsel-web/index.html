<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EngSel 엥셀</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css?v=25">
  </head>
  <body>
    <header id="site-header"></header>
    <main id="view"></main>
    <p id="toast" class="toast" role="status" hidden></p>
    <div id="select-toolbar" class="select-toolbar" role="toolbar" aria-label="선택 도구" hidden>
      <button type="button" data-action="add-highlight">형광펜</button>
      <button type="button" data-action="add-memo">메모 추가</button>
    </div>
    <form id="memo-popover" class="memo-popover" hidden>
      <label for="memo-input">메모
        <textarea id="memo-input" rows="3" placeholder="이 부분에 메모를 적으세요."></textarea>
      </label>
      <div class="list-actions">
        <button type="submit" class="pill">저장</button>
        <button type="button" class="ghost" data-action="close-memo">닫기</button>
      </div>
    </form>
    <div id="note-popover" class="note-popover" role="dialog" aria-label="저장된 메모" hidden>
      <p id="note-popover-text"></p>
      <div id="note-popover-actions" class="list-actions">
        <button type="button" class="ghost" data-action="edit-memo">수정</button>
        <button type="button" class="ghost" data-action="delete-memo">메모 지우기</button>
      </div>
    </div>
    <div id="note-actions" class="note-actions" role="menu" aria-label="메모 작업" hidden>
      <button type="button" role="menuitem" data-action="edit-memo">수정</button>
      <button type="button" role="menuitem" data-action="delete-memo">메모 지우기</button>
    </div>
    <div id="assistant" class="assistant" hidden>
      <section id="assistant-panel" class="assistant-panel" role="dialog" aria-label="AI 도우미" hidden>
        <header class="assistant-head">
          <p>AI 도우미</p>
          <button type="button" data-action="close-assistant">닫기</button>
        </header>
        <div id="assistant-log" class="assistant-log">
          <p class="muted">공부하다가 궁금한 점을 물어보세요.</p>
        </div>
        <form id="assistant-form" class="assistant-form">
          <label class="sr-only" for="assistant-question">질문</label>
          <textarea id="assistant-question" rows="2" placeholder="질문을 적어 보세요."></textarea>
          <button type="submit" id="assistant-send" disabled>보내기</button>
        </form>
      </section>
      <button type="button" id="assistant-toggle" class="assistant-button" aria-expanded="false" aria-controls="assistant-panel">AI</button>
    </div>
    <script src="js/geminiService.js?v=1"></script>
    <script src="js/app.js?v=33"></script>
  </body>
</html>
